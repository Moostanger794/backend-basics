openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Library API
  version: 1.0.0
  description: 'Учебный контракт сервиса «Библиотека»: книги, читатели и выдачи. Даты и время определяются в UTC.
    Все тела JSON используют snake_case, пути ресурсов — kebab-case и множественное число. Нормативные правила конкурентности
    и динамической валидации описаны у операций: одна JSON Schema не может проверить текущее время и состояние базы.
    Ответы допускают новые поля; клиенты должны игнорировать неизвестные поля ответа. Запросы не допускают неизвестных
    полей. Примеры выдачи рассчитаны на 2026-10-18 UTC; при реальном запросе выбирать due_date позже текущей даты.
    Это контракт, сервер в рамках работы не реализован.'
servers:
- url: http://localhost:4010/v1/
  description: Адрес для локальной реализации/mock; работа не запускает сервер автоматически.
tags:
- name: Books
  description: Каталог книг и учёт экземпляров.
- name: Readers
  description: Регистрация и обслуживание читателей.
- name: Loans
  description: Выдачи, возвраты и история.
security:
- BearerAuth: []
paths:
  /books:
    get:
      tags:
      - Books
      operationId: listBooks
      summary: 'Список: Books'
      description: 'Все фильтры объединяются через AND. Строковые фильтры title, author, full_name ищут подстроку
        без учёта регистра; isbn, email и UUID сравниваются точно (email без учёта регистра). Сортировка по одному
        полю; префикс - означает убывание. При равенстве значений дополнительно сортировать по id по возрастанию.
        Пагинация offset/page: total_items после фильтрации, total_pages = ceil(total_items / page_size), для пустой
        коллекции 0. В рамках одного ответа items и счётчики относятся к одному снимку данных. Между запросами страницы
        могут сдвигаться при изменении данных. Неизвестные query-параметры и повторы параметров: 400; неверные значения:
        422.'
      responses:
        '200':
          description: Коллекция и метаданные пагинации.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookList'
              examples:
                BookList:
                  $ref: '#/components/examples/BookList'
                BookEmptyList:
                  $ref: '#/components/examples/BookEmptyList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - name: title
        in: query
        description: Подстрока названия.
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 300
      - name: author
        in: query
        description: Подстрока имени автора.
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: isbn
        in: query
        description: Точный ISBN-13.
        required: false
        schema:
          type: string
          pattern: ^(978|979)[0-9]{10}$
      - name: published_year
        in: query
        description: Год публикации.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 9999
      - name: available
        in: query
        description: 'true: available_copies > 0; false: available_copies = 0.'
        required: false
        schema:
          type: boolean
      - name: sort
        in: query
        description: Поле и направление сортировки.
        required: false
        schema:
          type: string
          enum:
          - title
          - -title
          - author
          - -author
          - published_year
          - -published_year
          - id
          - -id
          default: title
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
    post:
      tags:
      - Books
      operationId: createBook
      summary: Создание книги
      description: Создание книги. Сервер назначает id. available_copies изначально равен total_copies; клиент не
        передаёт available_copies.
      responses:
        '201':
          description: Ресурс создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
              examples:
                BookCreated:
                  $ref: '#/components/examples/BookCreated'
          headers:
            Location:
              description: URI созданного ресурса, включает версию API.
              schema:
                type: string
                format: uri-reference
              example: /v1/books/11111111-1111-4111-8111-111111111111
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          description: 'CONFLICT: уникальное значение уже используется.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                DuplicateIsbn:
                  $ref: '#/components/examples/DuplicateIsbn'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreate'
            examples:
              BookCreate:
                $ref: '#/components/examples/BookCreate'
  /books/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Books
      operationId: getBook
      summary: Получение книги
      description: Возвращает неудалённый ресурс по UUID.
      responses:
        '200':
          description: Ресурс найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
              examples:
                Book:
                  $ref: '#/components/examples/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Books
      operationId: updateBook
      summary: Обновление книги
      description: Частично обновляет переданные поля атомарно. Пропущенные поля сохраняются. null, пустое тело
        и неизвестные поля запрещены. Нельзя снизить total_copies ниже количества активных выдач. Сервер пересчитывает
        available_copies; операция синхронизирована с выдачами и возвратами.
      responses:
        '200':
          description: Обновлённый ресурс.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
              examples:
                BookUpdated:
                  $ref: '#/components/examples/BookUpdated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'CONFLICT: дублирование уникального поля. Для книг BUSINESS_RULE_VIOLATION: фонд меньше активных
            выдач.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                DuplicateIsbn:
                  $ref: '#/components/examples/DuplicateIsbn'
                CopiesBelowLoans:
                  $ref: '#/components/examples/CopiesBelowLoans'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookUpdate'
            examples:
              BookUpdate:
                $ref: '#/components/examples/BookUpdate'
    delete:
      tags:
      - Books
      operationId: deleteBook
      summary: Удаление книги
      description: 'Удаление запрещено при любой активной выдаче (returned_at = null), включая просроченные: 409
        BUSINESS_RULE_VIOLATION. Проверка и удаление атомарны относительно создания выдач. При отсутствии активных
        выдач ресурс скрывается из GET и списков; история завершённых выдач и идентификаторы сохраняются. Повторное
        удаление: 404. Успешный ответ не содержит тела.'
      responses:
        '204':
          description: Ресурс удалён; тело ответа отсутствует.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'BUSINESS_RULE_VIOLATION: есть активные выдачи.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ActiveLoans:
                  $ref: '#/components/examples/ActiveLoans'
  /readers:
    get:
      tags:
      - Readers
      operationId: listReaders
      summary: 'Список: Readers'
      description: 'Все фильтры объединяются через AND. Строковые фильтры title, author, full_name ищут подстроку
        без учёта регистра; isbn, email и UUID сравниваются точно (email без учёта регистра). Сортировка по одному
        полю; префикс - означает убывание. При равенстве значений дополнительно сортировать по id по возрастанию.
        Пагинация offset/page: total_items после фильтрации, total_pages = ceil(total_items / page_size), для пустой
        коллекции 0. В рамках одного ответа items и счётчики относятся к одному снимку данных. Между запросами страницы
        могут сдвигаться при изменении данных. Неизвестные query-параметры и повторы параметров: 400; неверные значения:
        422.'
      responses:
        '200':
          description: Коллекция и метаданные пагинации.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderList'
              examples:
                ReaderList:
                  $ref: '#/components/examples/ReaderList'
                ReaderEmptyList:
                  $ref: '#/components/examples/ReaderEmptyList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - name: full_name
        in: query
        description: Подстрока имени.
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: email
        in: query
        description: Точное совпадение email без учёта регистра.
        required: false
        schema:
          type: string
          format: email
          maxLength: 254
      - name: sort
        in: query
        description: Поле и направление сортировки.
        required: false
        schema:
          type: string
          enum:
          - full_name
          - -full_name
          - registered_at
          - -registered_at
          - id
          - -id
          default: full_name
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
    post:
      tags:
      - Readers
      operationId: createReader
      summary: Создание читателя
      description: Создание читателя. Сервер назначает id. registered_at назначает сервер; клиент его не передаёт.
      responses:
        '201':
          description: Ресурс создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reader'
              examples:
                Reader:
                  $ref: '#/components/examples/Reader'
          headers:
            Location:
              description: URI созданного ресурса, включает версию API.
              schema:
                type: string
                format: uri-reference
              example: /v1/readers/22222222-2222-4222-8222-222222222222
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          description: 'CONFLICT: уникальное значение уже используется.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                DuplicateEmail:
                  $ref: '#/components/examples/DuplicateEmail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReaderCreate'
            examples:
              ReaderCreate:
                $ref: '#/components/examples/ReaderCreate'
  /readers/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Readers
      operationId: getReader
      summary: Получение читателя
      description: Возвращает неудалённый ресурс по UUID.
      responses:
        '200':
          description: Ресурс найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reader'
              examples:
                Reader:
                  $ref: '#/components/examples/Reader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Readers
      operationId: updateReader
      summary: Обновление читателя
      description: Частично обновляет переданные поля атомарно. Пропущенные поля сохраняются. null, пустое тело
        и неизвестные поля запрещены. id и registered_at не изменяются. Уникальность email проверяется без учёта
        регистра.
      responses:
        '200':
          description: Обновлённый ресурс.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reader'
              examples:
                ReaderUpdated:
                  $ref: '#/components/examples/ReaderUpdated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'CONFLICT: дублирование уникального поля. Для книг BUSINESS_RULE_VIOLATION: фонд меньше активных
            выдач.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                DuplicateEmail:
                  $ref: '#/components/examples/DuplicateEmail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReaderUpdate'
            examples:
              ReaderUpdate:
                $ref: '#/components/examples/ReaderUpdate'
    delete:
      tags:
      - Readers
      operationId: deleteReader
      summary: Удаление читателя
      description: 'Удаление запрещено при любой активной выдаче (returned_at = null), включая просроченные: 409
        BUSINESS_RULE_VIOLATION. Проверка и удаление атомарны относительно создания выдач. При отсутствии активных
        выдач ресурс скрывается из GET и списков; история завершённых выдач и идентификаторы сохраняются. Повторное
        удаление: 404. Успешный ответ не содержит тела.'
      responses:
        '204':
          description: Ресурс удалён; тело ответа отсутствует.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'BUSINESS_RULE_VIOLATION: есть активные выдачи.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ActiveLoans:
                  $ref: '#/components/examples/ActiveLoans'
  /loans:
    get:
      tags:
      - Loans
      operationId: listLoans
      summary: Список выдач
      description: 'Все фильтры объединяются через AND. Строковые фильтры title, author, full_name ищут подстроку
        без учёта регистра; isbn, email и UUID сравниваются точно (email без учёта регистра). Сортировка по одному
        полю; префикс - означает убывание. При равенстве значений дополнительно сортировать по id по возрастанию.
        Пагинация offset/page: total_items после фильтрации, total_pages = ceil(total_items / page_size), для пустой
        коллекции 0. В рамках одного ответа items и счётчики относятся к одному снимку данных. Между запросами страницы
        могут сдвигаться при изменении данных. Неизвестные query-параметры и повторы параметров: 400; неверные значения:
        422. status=active: returned_at = null (включая просроченные); returned: returned_at != null; overdue: returned_at
        = null AND due_date < текущая дата UTC. В день due_date выдача ещё не просрочена. Без status возвращаются
        все выдачи, включая историю удалённых книг/читателей. Фильтр по неизвестному UUID возвращает пустой список.'
      responses:
        '200':
          description: Коллекция выдач.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanList'
              examples:
                LoanList:
                  $ref: '#/components/examples/LoanList'
                LoanEmptyList:
                  $ref: '#/components/examples/LoanEmptyList'
                OverdueLoanList:
                  $ref: '#/components/examples/OverdueLoanList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - name: status
        in: query
        description: Фильтр состояния выдачи.
        required: false
        schema:
          type: string
          enum:
          - active
          - returned
          - overdue
      - name: book_id
        in: query
        description: Выдачи конкретной книги.
        required: false
        schema:
          type: string
          format: uuid
      - name: reader_id
        in: query
        description: Выдачи конкретного читателя.
        required: false
        schema:
          type: string
          format: uuid
      - name: sort
        in: query
        description: Поле и направление сортировки.
        required: false
        schema:
          type: string
          enum:
          - loaned_at
          - -loaned_at
          - due_date
          - -due_date
          - id
          - -id
          default: -loaned_at
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
    post:
      tags:
      - Loans
      operationId: createLoan
      summary: Выдать книгу
      description: |-
        Создаёт выдачу и атомарно уменьшает доступный остаток на один. Книга и читатель должны существовать и быть неудалёнными (иначе 404 NOT_FOUND). available_copies > 0; у читателя менее 5 активных выдач (returned_at = null), включая просроченные. При нарушении: 409 BUSINESS_RULE_VIOLATION с причиной no_available_copies или active_loan_limit. due_date строго позже текущей даты UTC, иначе 422 BUSINESS_RULE_VIOLATION. Проверка остатков, лимита и запись выдачи выполняются в одной транзакции с блокировками книги и читателя: параллельные запросы даже с разными ключами не могут нарушить ограничения.

        Политика Idempotency-Key:
        1. Заголовок обязателен. Отсутствующий/некорректный ключ: 400 INVALID_REQUEST. JWT проверяется при каждом обращении, в том числе при replay. Область ключа: неизменный JWT sub + POST + /loans (внутри v1); смена токена того же sub область не меняет.
        2. До резервирования ключа проверяются JSON и схема; 400, 401, 415, структурный 422 VALIDATION_ERROR не сохраняются. Равенство тел: рекурсивное равенство разобранных JSON до бизнес-нормализации; порядок полей объекта и пробелы JSON незначимы, строки сравниваются точно. Повторяющиеся ключи объекта запрещены (400).
        3. После проверки формы сервер атомарно резервирует ключ вместе с отпечатком тела. При другом теле возвращается 409 IDEMPOTENCY_MISMATCH, даже если первый запрос ещё выполняется. Исходная запись не изменяется.
        4. Одновременный повтор с тем же телом во время обработки получает 409 CONFLICT, details.reason=request_in_progress, Retry-After: 1. Он не запускает вторую выдачу и не заменяет сохранённый результат. Клиент повторяет запрос с прежним ключом и телом.
        5. Завершённый результат (201 либо доменный 404, 409, 422) сохраняется на 24 часа с момента завершения. Повтор в этот период воспроизводит исходные HTTP-статус, байты тела и все прикладные заголовки (Content-Type и Location, если был), без повторных проверок текущей даты, остатков и лимита. В том числе возвращается прежний returned_at=null, даже если выдача уже возвращена. Транспортные заголовки Date, Connection и Transfer-Encoding могут отличаться. request_id в ошибке сохраняется. Replay не продлевает TTL.
        6. Конкурентный 409 request_in_progress и 409 IDEMPOTENCY_MISMATCH не кэшируются как итог. После 24 часов завершённый ключ считается новым и может создать новую выдачу; для новой операции рекомендуется новый ключ.
        7. Выдача и итоговая запись идемпотентности фиксируются атомарно в надёжном хранилище. Незавершённая запись не удаляется по TTL завершённых результатов: после сбоя сервер восстанавливает её состояние, прежде чем допустить новую обработку. Временный 503 не сохраняется как окончательный результат; повтор с прежним ключом либо получает восстановленный ответ, либо безопасно продолжает обработку. Вторая выдача после потерянного ответа запрещена.
      responses:
        '201':
          description: Выдача создана; при replay возвращается тот же статус, тело и прикладные заголовки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
              examples:
                Loan:
                  $ref: '#/components/examples/Loan'
          headers:
            Location:
              description: URI созданного ресурса, включает версию API.
              schema:
                type: string
                format: uri-reference
              example: /v1/loans/33333333-3333-4333-8333-333333333333
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 'VALIDATION_ERROR: нарушение схемы; BUSINESS_RULE_VIOLATION: due_date не позже сегодняшней
            даты UTC.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ValidationError:
                  $ref: '#/components/examples/ValidationError'
                PastDueDate:
                  $ref: '#/components/examples/PastDueDate'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '404':
          description: 'NOT_FOUND: книга или читатель не найдены либо удалены.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                LoanBookNotFound:
                  $ref: '#/components/examples/LoanBookNotFound'
                LoanReaderNotFound:
                  $ref: '#/components/examples/LoanReaderNotFound'
        '409':
          description: 'BUSINESS_RULE_VIOLATION: нет экземпляров или достигнут лимит. IDEMPOTENCY_MISMATCH: другое
            тело с тем же ключом. CONFLICT: исходный запрос ещё выполняется.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NoCopies:
                  $ref: '#/components/examples/NoCopies'
                LoanLimit:
                  $ref: '#/components/examples/LoanLimit'
                IdempotencyMismatch:
                  $ref: '#/components/examples/IdempotencyMismatch'
                InProgress:
                  $ref: '#/components/examples/InProgress'
          headers:
            Retry-After:
              description: Обязателен только при request_in_progress, отсутствует у остальных 409. Секунды до повтора.
              schema:
                type: integer
                const: 1
              example: 1
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanCreate'
            examples:
              LoanCreate:
                $ref: '#/components/examples/LoanCreate'
  /loans/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Loans
      operationId: getLoan
      summary: Получить выдачу
      description: Возвращает активную либо завершённую выдачу. История доступна и после удаления книги/читателя;
        book_id и reader_id сохраняются, но GET соответствующего удалённого ресурса вернёт 404.
      responses:
        '200':
          description: Выдача найдена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
              examples:
                Loan:
                  $ref: '#/components/examples/Loan'
                LoanReturned:
                  $ref: '#/components/examples/LoanReturned'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
  /loans/{id}/return:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      tags:
      - Loans
      operationId: returnLoan
      summary: Вернуть книгу
      description: 'Тело запроса не передаётся; любое непустое тело: 400 INVALID_REQUEST. Для активной выдачи сервер
        атомарно устанавливает returned_at в текущее время UTC и освобождает один экземпляр. Повторный или конкурентный
        возврат уже завершённой выдачи возвращает 200 с тем же returned_at; остаток повторно не увеличивается. Возврат
        просроченной выдачи разрешён. История не удаляется. Idempotency-Key не требуется: эффект операции идемпотентен
        по id выдачи.'
      responses:
        '200':
          description: Завершённая выдача; также при повторном возврате.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
              examples:
                LoanReturned:
                  $ref: '#/components/examples/LoanReturned'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Действующий JWT сотрудника библиотеки. Сервер проверяет подпись, разрешённый алгоритм, exp, iss,
        aud и непустой стабильный sub. Выдача токенов и роли вне рамок учебного контракта; любой прошедший проверку
        сотрудник имеет доступ ко всем операциям. Использовать HTTPS вне localhost.
  parameters:
    Id:
      name: id
      in: path
      description: UUID ресурса.
      required: true
      schema:
        type: string
        format: uuid
      example: 11111111-1111-4111-8111-111111111111
    Page:
      name: page
      in: query
      description: 'Номер страницы, начиная с 1. Страница за концом списка возвращает 200 и items: [].'
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: Число элементов на странице, максимум 100.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 'Обязательный непрозрачный ключ. Область: JWT sub + HTTP-метод + путь. Полная политика replay,
        конкуренции и TTL описана у createLoan.'
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
      example: loan-20261018-0001
  schemas:
    Book:
      type: object
      required:
      - id
      - title
      - author
      - isbn
      - published_year
      - total_copies
      - available_copies
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 300
          pattern: \S
          description: Название; пробелы по краям удаляет сервер. Строка из одних пробелов запрещена.
        author:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: Автор; пробелы по краям удаляет сервер.
        isbn:
          type: string
          pattern: ^(978|979)[0-9]{10}$
          description: 'ISBN-13 без дефисов. Сервер проверяет контрольную цифру; ошибка: 422 VALIDATION_ERROR. Уникален
            среди неудалённых книг.'
        published_year:
          type: integer
          minimum: 1
          maximum: 9999
        total_copies:
          type: integer
          minimum: 0
          maximum: 1000000
          description: 'Общее число экземпляров. Нельзя установить меньше числа активных выдач: 409 BUSINESS_RULE_VIOLATION.'
        available_copies:
          type: integer
          minimum: 0
          maximum: 1000000
          readOnly: true
          description: 'Вычисляется сервером: total_copies минус количество выдач этой книги с returned_at = null.
            Всегда от 0 до total_copies.'
    BookCreate:
      type: object
      required:
      - title
      - author
      - isbn
      - published_year
      - total_copies
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
          pattern: \S
          description: Название; пробелы по краям удаляет сервер. Строка из одних пробелов запрещена.
        author:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: Автор; пробелы по краям удаляет сервер.
        isbn:
          type: string
          pattern: ^(978|979)[0-9]{10}$
          description: 'ISBN-13 без дефисов. Сервер проверяет контрольную цифру; ошибка: 422 VALIDATION_ERROR. Уникален
            среди неудалённых книг.'
        published_year:
          type: integer
          minimum: 1
          maximum: 9999
        total_copies:
          type: integer
          minimum: 0
          maximum: 1000000
          description: 'Общее число экземпляров. Нельзя установить меньше числа активных выдач: 409 BUSINESS_RULE_VIOLATION.'
      additionalProperties: false
    BookUpdate:
      type: object
      required: []
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
          pattern: \S
          description: Название; пробелы по краям удаляет сервер. Строка из одних пробелов запрещена.
        author:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: Автор; пробелы по краям удаляет сервер.
        isbn:
          type: string
          pattern: ^(978|979)[0-9]{10}$
          description: 'ISBN-13 без дефисов. Сервер проверяет контрольную цифру; ошибка: 422 VALIDATION_ERROR. Уникален
            среди неудалённых книг.'
        published_year:
          type: integer
          minimum: 1
          maximum: 9999
        total_copies:
          type: integer
          minimum: 0
          maximum: 1000000
          description: 'Общее число экземпляров. Нельзя установить меньше числа активных выдач: 409 BUSINESS_RULE_VIOLATION.'
      additionalProperties: false
      minProperties: 1
      description: 'Частичное обновление: отсутствующее поле сохраняет значение. null и пустой объект запрещены.
        Серверные поля не принимаются.'
    Reader:
      type: object
      required:
      - id
      - full_name
      - email
      - registered_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: Имя читателя; пробелы по краям удаляет сервер.
        email:
          type: string
          format: email
          maxLength: 254
          description: Адрес уникален среди неудалённых читателей. Для сравнения и хранения сервер приводит весь
            адрес к нижнему регистру.
        registered_at:
          type: string
          format: date-time
          readOnly: true
          description: Серверное время регистрации в UTC.
    ReaderCreate:
      type: object
      required:
      - full_name
      - email
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: Имя читателя; пробелы по краям удаляет сервер.
        email:
          type: string
          format: email
          maxLength: 254
          description: Адрес уникален среди неудалённых читателей. Для сравнения и хранения сервер приводит весь
            адрес к нижнему регистру.
      additionalProperties: false
    ReaderUpdate:
      type: object
      required: []
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: Имя читателя; пробелы по краям удаляет сервер.
        email:
          type: string
          format: email
          maxLength: 254
          description: Адрес уникален среди неудалённых читателей. Для сравнения и хранения сервер приводит весь
            адрес к нижнему регистру.
      additionalProperties: false
      minProperties: 1
      description: 'Частичное обновление: отсутствующие поля сохраняют значения; null и пустой объект запрещены.'
    LoanCreate:
      type: object
      required:
      - book_id
      - reader_id
      - due_date
      properties:
        book_id:
          type: string
          format: uuid
        reader_id:
          type: string
          format: uuid
        due_date:
          type: string
          format: date
          description: 'Дата возврата, строго позже текущей календарной даты UTC при первой обработке запроса. Сегодня
            и прошлые даты: 422 BUSINESS_RULE_VIOLATION. Динамическое сравнение выполняет сервер.'
      additionalProperties: false
    Loan:
      type: object
      required:
      - id
      - book_id
      - reader_id
      - loaned_at
      - due_date
      - returned_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        book_id:
          type: string
          format: uuid
        reader_id:
          type: string
          format: uuid
        loaned_at:
          type: string
          format: date-time
          readOnly: true
        due_date:
          type: string
          format: date
        returned_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: null до возврата; затем серверное время возврата в UTC, не ранее loaned_at.
    Pagination:
      type: object
      required:
      - page
      - page_size
      - total_items
      - total_pages
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total_items:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    ErrorDetail:
      type: object
      required:
      - field
      - reason
      properties:
        field:
          type: string
          description: JSON Pointer для поля тела либо query.<name>, path.id, header.<name>; пустая строка для общей
            ошибки.
        reason:
          type: string
          minLength: 1
          maxLength: 100
          description: Стабильная причина ошибки в snake_case.
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - details
          - request_id
          properties:
            code:
              type: string
              enum:
              - INVALID_REQUEST
              - NOT_FOUND
              - VALIDATION_ERROR
              - CONFLICT
              - BUSINESS_RULE_VIOLATION
              - IDEMPOTENCY_MISMATCH
              - UNAUTHORIZED
              - SERVICE_UNAVAILABLE
            message:
              type: string
              minLength: 1
              maxLength: 1000
              description: Пояснение для человека; клиент не должен разбирать этот текст.
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            request_id:
              type: string
              format: uuid
              description: Идентификатор исходной обработки; при replay сохраняется.
    BookList:
      type: object
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ReaderList:
      type: object
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Reader'
        pagination:
          $ref: '#/components/schemas/Pagination'
    LoanList:
      type: object
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Loan'
        pagination:
          $ref: '#/components/schemas/Pagination'
  responses:
    BadRequest:
      description: '400: неразбираемый JSON, повторяющиеся ключи JSON/параметры query, неизвестный query-параметр,
        отсутствующий или некорректный Idempotency-Key. INVALID_REQUEST.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            InvalidRequest:
              $ref: '#/components/examples/InvalidRequest'
            MissingKey:
              $ref: '#/components/examples/MissingKey'
    ValidationError:
      description: '422 VALIDATION_ERROR: тело или параметр нарушает схему, формат, контрольную цифру ISBN; неизвестное
        поле тела, недопустимый null. Динамические бизнес-ограничения описаны отдельно.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            ValidationError:
              $ref: '#/components/examples/ValidationError'
    NotFound:
      description: '404 NOT_FOUND: ресурс отсутствует или удалён. Невалидный формат UUID даёт 422, а не 404.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            NotFound:
              $ref: '#/components/examples/NotFound'
    Unauthorized:
      description: '401 UNAUTHORIZED: Bearer JWT отсутствует, истёк либо недействителен. Проверяется до поиска ресурса
        и replay.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Unauthorized:
              $ref: '#/components/examples/Unauthorized'
      headers:
        WWW-Authenticate:
          description: Схема аутентификации.
          schema:
            type: string
          example: Bearer
    UnsupportedMediaType:
      description: '415 INVALID_REQUEST: тело передано не как application/json.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            UnsupportedMediaType:
              $ref: '#/components/examples/UnsupportedMediaType'
    ServiceUnavailable:
      description: '503 SERVICE_UNAVAILABLE: временный сбой. Повторить после Retry-After. Для POST /loans использовать
        исходные тело и ключ; сервер восстанавливает результат без повторного создания выдачи.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            ServiceUnavailable:
              $ref: '#/components/examples/ServiceUnavailable'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          example: 1
          description: Задержка до повтора в секундах.
  examples:
    Book:
      summary: Книга с одной активной выдачей
      value:
        id: 11111111-1111-4111-8111-111111111111
        title: Мастер и Маргарита
        author: Михаил Булгаков
        isbn: '9780141180144'
        published_year: 1967
        total_copies: 3
        available_copies: 2
    BookCreated:
      summary: 'Новая книга: все экземпляры доступны'
      value:
        id: 11111111-1111-4111-8111-111111111111
        title: Мастер и Маргарита
        author: Михаил Булгаков
        isbn: '9780141180144'
        published_year: 1967
        total_copies: 3
        available_copies: 3
    BookCreate:
      summary: Создание книги
      value:
        title: Мастер и Маргарита
        author: Михаил Булгаков
        isbn: '9780141180144'
        published_year: 1967
        total_copies: 3
    BookUpdate:
      summary: Увеличение фонда
      value:
        total_copies: 5
    BookUpdated:
      summary: Фонд увеличен, одна выдача активна
      value:
        id: 11111111-1111-4111-8111-111111111111
        title: Мастер и Маргарита
        author: Михаил Булгаков
        isbn: '9780141180144'
        published_year: 1967
        total_copies: 5
        available_copies: 4
    Reader:
      summary: Зарегистрированный читатель
      value:
        id: 22222222-2222-4222-8222-222222222222
        full_name: Анна Иванова
        email: anna@example.com
        registered_at: '2026-10-01T09:00:00Z'
    ReaderCreate:
      summary: Регистрация читателя
